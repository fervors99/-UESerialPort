[package]
name = "ue_serial_port"
version = "2.0.0"
edition = "2021"
authors = ["Carols Pan <fervors99@github.com>"]
description = "Industrial-grade Rust serial port FFI library for Unreal Engine 5.7+"
license = "MIT"
repository = "https://github.com/fervors99/ue_serial_port"
keywords = ["serial", "ffi", "unreal-engine", "ue5", "industrial"]
categories = ["hardware-support", "embedded", "game-development"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serialport = "4.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "buffer_operations"
harness = false